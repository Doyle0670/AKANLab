<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İlk Sitem</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#111;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      flex-direction:column;
    }

    h1{
      font-size:60px;
      margin:0;
    }

    p{
      font-size:20px;
      opacity:0.8;
    }

    button{
      margin-top:20px;
      padding:15px 30px;
      border:none;
      border-radius:10px;
      background:#00bcd4;
      color:white;
      font-size:18px;
      cursor:pointer;
    }

    button:hover{
      background:#0097a7;
    }
  </style>
</head>

<body>

  <h1>Merhaba 👋</h1>
  <p>Benim ilk internet sitem</p>

  <button onclick="mesaj()">
    Tıkla
  </button>

  <script>
    function mesaj(){
      alert("Site çalışıyor 🚀");
    }
  </script>

</body>
</html>
