<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AKAN PERFORMANCE | Yakında Tekrar Buradayız</title>
  <meta name="description" content="AKAN PERFORMANCE kısa bir aranın ardından yeniden hizmetinizde olacak.">
  <meta name="robots" content="noindex, follow">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 30px 20px;

      background:
        radial-gradient(circle at 50% 35%, rgba(30,167,255,.14), transparent 35%),
        radial-gradient(circle at 15% 80%, rgba(11,94,215,.10), transparent 30%),
        #020817;

      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .background-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .12;

      background-image:
        linear-gradient(rgba(30,167,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,167,255,.08) 1px, transparent 1px);

      background-size: 50px 50px;
      mask-image: linear-gradient(to bottom, transparent, #000, transparent);
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .brand {
      margin-bottom: 55px;
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 900;
      letter-spacing: -1px;
    }

    .brand .white {
      color: #fff;
    }

    .brand .blue {
      color: #1EA7FF;
    }

    .line {
      width: 65px;
      height: 3px;
      margin: 0 auto 28px;
      border-radius: 20px;
      background: #1EA7FF;
      box-shadow: 0 0 25px rgba(30,167,255,.5);
    }

    .eyebrow {
      margin-bottom: 20px;
      color: #1EA7FF;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 6px;
    }

    h1 {
      margin-bottom: 25px;
      font-size: clamp(44px, 8vw, 90px);
      line-height: .95;
      letter-spacing: -4px;
      font-weight: 900;
    }

    h1 span {
      color: #1EA7FF;
    }

    .description {
      max-width: 630px;
      margin: 0 auto;
      color: #aeb9ca;
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.8;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      margin-top: 35px;
      padding: 11px 18px;

      border: 1px solid rgba(30,167,255,.22);
      border-radius: 100px;
      background: rgba(7,17,32,.7);

      color: #dce7f5;
      font-size: 13px;
      font-weight: 700;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1EA7FF;
      box-shadow: 0 0 12px #1EA7FF;
    }

    .divider {
      width: 100%;
      max-width: 500px;
      height: 1px;
      margin: 55px auto 28px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(30,167,255,.4),
        transparent
      );
    }

    .motto {
      color: #718096;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 5px;
    }

    footer {
      margin-top: 30px;
      color: #536176;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      body {
        padding: 25px 18px;
      }

      .brand {
        margin-bottom: 45px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .eyebrow,
      .motto {
        letter-spacing: 3px;
      }

      .divider {
        margin-top: 45px;
      }
    }
  </style>
</head>

<body>

  <div class="background-grid"></div>

  <main class="container">

    <div class="brand">
      <span class="white">AKAN</span>
      <span class="blue"> PERFORMANCE</span>
    </div>

    <div class="line"></div>

    <div class="eyebrow">
      PERFORMANS · BİLİM · GELİŞİM
    </div>

    <h1>
      KISA BİR <span>ARA.</span>
    </h1>

    <p class="description">
      AKAN PERFORMANCE olarak kısa bir süreliğine ara veriyoruz.
      Daha güçlü ve daha iyi bir deneyimle yeniden burada olacağız.
    </p>

    <div class="status">
      <span class="dot"></span>
      Yakında tekrar buradayız
    </div>

    <div class="divider"></div>

    <div class="motto">
      ÖLÇ · ANALİZ ET · GELİŞ
    </div>

    <footer>
      © 2026 AKAN PERFORMANCE
    </footer>

  </main>

</body>
</html>
